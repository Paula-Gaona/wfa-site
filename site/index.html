<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wolverine Finance Association</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: green UVU masthead (brand row + nav row) + market-ticker band, then a single content column (max 1120px) whose views swap by role. */
:root{
  --brand:#275D38;          /* UVU Green */
  --brand-deep:#1a4026;
  --brand-text:#275D38;
  --on-brand:#ffffff;
  --tint:#e6efe8;
  --paper:#f7f9f7;
  --surface:#ffffff;
  --ink:#0f1511;
  --muted:#56655a;
  --line:#d5dfd7;
  --header-bg:#275D38;
  --ticker-bg:#0f1511;
  --ticker-fg:#e6efe8;
  --up:#2f9a55;
  --warn:#9a6a00;
  --danger:#b3261e;
  --cat-meeting:#4b5a50; --cat-speaker:#275D38; --cat-workshop:#2d5d86; --cat-competition:#6a3f86; --cat-social:#9a4a26; --cat-career:#7a5c12; --cat-excursion:#1f7a7a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#2f7046; --brand-deep:#1b3d27; --brand-text:#82c99a; --on-brand:#ffffff; --tint:#17281d;
  --paper:#0c120e; --surface:#131b16; --ink:#e7eee9; --muted:#9aae9f; --line:#26352b;
  --header-bg:#163322; --ticker-bg:#050806; --ticker-fg:#cfe3d5; --up:#5fd08a; --warn:#f0c060; --danger:#ff8a80;
  --cat-meeting:#8fa094; --cat-speaker:#6cc28a; --cat-workshop:#6fa8dc; --cat-competition:#b48fd6; --cat-social:#e0956b; --cat-career:#e0b860; --cat-excursion:#5fc4c4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2f7046; --brand-deep:#1b3d27; --brand-text:#82c99a; --on-brand:#ffffff; --tint:#17281d;
  --paper:#0c120e; --surface:#131b16; --ink:#e7eee9; --muted:#9aae9f; --line:#26352b;
  --header-bg:#163322; --ticker-bg:#050806; --ticker-fg:#cfe3d5; --up:#5fd08a; --warn:#f0c060; --danger:#ff8a80;
  --cat-meeting:#8fa094; --cat-speaker:#6cc28a; --cat-workshop:#6fa8dc; --cat-competition:#b48fd6; --cat-social:#e0956b; --cat-career:#e0b860; --cat-excursion:#5fc4c4;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--brand-text)}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;text-transform:uppercase}
h1.page{font-size:clamp(2.2rem,5vw,3.2rem)}
h2{font-size:2rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.3rem;font-weight:700}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.page-head{display:flex;flex-direction:column;gap:6px;max-width:720px}
:focus-visible{outline:3px solid var(--up);outline-offset:2px}

/* Header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);color:var(--on-brand)}
.head-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.mark{width:40px;height:40px;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;line-height:1}
.brand-name small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;opacity:.8;font-weight:500}
.nav{display:flex;gap:2px;overflow-x:auto;flex-basis:100%;min-width:0;scrollbar-width:none;order:3;margin-inline:-12px}
.nav a{color:var(--on-brand);text-decoration:none;padding:10px 12px;white-space:nowrap;font-weight:600;opacity:.85;border-bottom:3px solid transparent}
.nav a:hover{opacity:1}
.nav a[aria-current="page"]{opacity:1;border-bottom-color:#fff}
.nav .sep{width:1px;background:rgba(255,255,255,.3);margin:10px 8px}
.nav a.staff{font-family:var(--mono);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:12px}
.nav .menu-btn{font:inherit;font-family:var(--mono);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--on-brand);background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 10px;white-space:nowrap;opacity:.85;cursor:pointer}
.nav .menu-btn:hover,.nav .menu-btn[aria-expanded="true"]{opacity:1}
.nav .menu-btn.current{opacity:1;border-bottom-color:#fff}
.navmenu{position:fixed;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 28px rgba(0,0,0,.2);padding:6px;min-width:220px;display:flex;flex-direction:column}
.navmenu a{color:var(--ink);text-decoration:none;padding:9px 12px;border-radius:4px;font-weight:600}
.navmenu a:hover,.navmenu a:focus-visible{background:var(--tint);outline:none}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .name{font-weight:600}

/* Wider header; on desktop the menu wraps to a second line instead of scrolling sideways */
.site-head .wrap{max-width:1440px}
@media (min-width:761px){.nav{flex-wrap:wrap;overflow:visible}}

/* Buttons & inputs */
.btn{font:inherit;font-weight:700;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);padding:9px 18px;border-radius:var(--radius);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.ghost{background:transparent;color:var(--brand-text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand-text)}
.btn.on-dark{background:#fff;color:#1a4026;border-color:#fff}
.btn.on-dark.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.92rem}
input,select,textarea{font:inherit;font-weight:400;padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand-text);outline:none;box-shadow:0 0 0 3px var(--tint)}
textarea{min-height:120px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:600}
.check input{width:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}
.err{color:var(--danger);font-weight:600;font-size:.92rem}
.err:empty{display:none}

/* Ticker */
.ticker{background:var(--ticker-bg);color:var(--ticker-fg);font-family:var(--mono);font-size:.8rem;overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--brand)}
.ticker-track{display:inline-flex;gap:44px;padding-block:9px;padding-left:20px;animation:tick 48s linear infinite}
.ticker-item{display:inline-flex;gap:10px}
.ticker .sym{color:#fff;font-weight:500}
.ticker .up{color:#5fd08a}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* Sections */
main{padding-block:36px 64px}
.view{display:flex;flex-direction:column;gap:40px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tile{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.hero-copy p.lede{font-size:1.2rem;max-width:34em;color:var(--muted)}
.next-card{background:var(--brand);color:var(--on-brand);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.next-card .eyebrow{color:rgba(255,255,255,.75)}
.next-card h3{font-size:1.7rem}
.bigdate{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;text-transform:uppercase}
.bigdate .d{font-size:4rem;line-height:.9}
.bigdate .m{font-size:1.5rem}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.today-bar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--brand-text);border-radius:var(--radius);padding:14px 18px;background:var(--tint)}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-text)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--up)}

/* Announcements */
.ann{display:flex;flex-direction:column;gap:6px;padding:18px 0;border-bottom:1px solid var(--line)}
.ann:first-child{padding-top:4px}
.ann-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.tag.pinned,.tag.ok{color:var(--brand-text)}
.tag.members{color:var(--cat-workshop)}
.tag.warn{color:var(--warn)}
.tag.bad{color:var(--danger)}
.ann-body{white-space:pre-wrap;max-width:68ch}
.home-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
.home-cols>*{min-width:0}
@media (max-width:860px){.home-cols{grid-template-columns:1fr}}

/* Event rows */
.ev-list{display:flex;flex-direction:column}
.ev-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.ev-row:hover .ev-title{color:var(--brand-text);text-decoration:underline}
.datebox{border:2px solid var(--ink);text-align:center;font-family:var(--display);text-transform:uppercase;line-height:1;padding:6px 0}
.datebox .m{font-size:.85rem;font-weight:700;display:block}
.datebox .d{font-size:1.75rem;font-weight:800}
.ev-title{font-weight:700;font-size:1.08rem}
.ev-sub{font-size:.9rem;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.cat::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.rsvp-count{font-family:var(--mono);font-size:.82rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rsvp-count .up{color:var(--up)}
.going{color:var(--brand-text);font-weight:700}

/* Calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cal-bar h2{min-width:9ch}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;font-weight:600;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted))}
.chip[aria-pressed="false"]{opacity:.5}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.cal .dow{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:8px;border-right:1px solid var(--line);border-bottom:2px solid var(--ink);color:var(--muted)}
.cal .cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.out{background:var(--paper)}
.cal .cell.out .num{opacity:.4}
.cal .num{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.cal .cell.today .num{background:var(--brand);color:var(--on-brand);border-radius:3px;padding:0 6px;align-self:flex-start}
.cal-ev{font:inherit;font-size:.8rem;font-weight:600;text-align:left;border:0;border-left:3px solid var(--c);background:var(--tint);color:var(--ink);padding:3px 6px;border-radius:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.cal-ev:hover{text-decoration:underline}
.cal-ev .t{font-family:var(--mono);font-weight:500;font-size:.7rem;color:var(--muted);margin-right:4px}
@media (max-width:640px){
  .cal .cell{min-height:58px;padding:4px}
  .cal-ev{font-size:0;padding:0;height:7px;border-left:0;background:var(--c);border-radius:2px}
  .cal-ev .t{display:none}
  .cal .dow{padding:6px 2px;text-align:center}
}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(5,10,7,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--radius);max-width:560px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--c,var(--brand))}
.modal.wide{max-width:900px}
.modal-in{padding:24px;display:flex;flex-direction:column;gap:16px}
.modal-x{float:right;font:inherit;font-size:1.4rem;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.facts dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--up)}
.codebig{font-family:var(--mono);font-size:clamp(3.5rem,14vw,7rem);letter-spacing:.2em;text-align:center;line-height:1;padding:20px 0;border:3px solid var(--ink);border-radius:var(--radius)}
.checkin-form{display:flex;gap:8px;flex-wrap:wrap}
.checkin-form input{width:9em;font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em}

/* Auth */
.auth{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.auth-side{background:var(--brand);color:var(--on-brand);padding:32px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.auth-side .eyebrow{color:rgba(255,255,255,.75)}
.auth-form{padding:32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.notice{background:var(--tint);border-left:4px solid var(--brand-text);padding:10px 14px;font-size:.95rem}
@media (max-width:760px){.auth{grid-template-columns:1fr}.auth-side,.auth-form{padding:22px}}

/* Tabs, tables */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:700;background:none;border:0;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand-text)}
.tabs .badge{font-family:var(--mono);font-size:.7rem;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:1px 7px;margin-left:6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
tr.me td{background:var(--tint);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
tr.sel td{background:var(--tint)}
td select{padding:5px 8px;width:auto}
.role{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.role.admin{background:var(--ink);color:var(--paper)}
.role.officer{background:var(--brand);color:var(--on-brand)}
.role.member{background:var(--tint);color:var(--brand-text)}
.site-head .role.member,.site-head .role.officer{background:#fff;color:#1a4026}
.site-head .role.admin{background:#0f1511;color:#fff}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.preview{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.list-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-row>div{min-width:0}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;margin-top:2px}
.task.done .ev-title{text-decoration:line-through;color:var(--muted)}
.pwset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;margin:0}
.pwset legend{font-weight:700;padding:0 6px;font-size:.92rem}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:4px;background:var(--tint);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;font-size:.9rem}
.pick button{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 6px;font-size:1.05rem;line-height:1}
.avail{border-collapse:separate;border-spacing:4px;width:auto}
.avail th{border:0;padding:4px 6px;text-align:center}
.avail th[scope="row"]{text-align:right;white-space:nowrap}
.avail td{padding:0;border:0}
.slot{width:56px;height:40px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--on-brand);font:inherit;font-weight:700;cursor:pointer}
.slot:hover{border-color:var(--brand-text)}
.slot.on{background:var(--brand);border-color:var(--brand)}
.heat{width:64px;height:40px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);color:var(--ink);background:color-mix(in srgb, var(--brand) calc(var(--a) * 100%), var(--surface))}
.best{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.best li span{margin-left:10px}
.rank-row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.rank-row select{width:auto}
table.bulk td{padding:4px}
table.bulk input,table.bulk select{padding:6px 8px;min-width:120px}
.mail-pre{white-space:pre-wrap;font-size:.95rem;overflow-wrap:anywhere}

/* About, officers, resources, recaps */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.pillar{border-top:4px solid var(--brand);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.officers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.officer{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.officer-top{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;flex:none;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}
img.avatar{object-fit:cover;display:block}
.officer .title{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-text)}
.contact{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto;font-size:.92rem}
.contact .line{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.contact .line span{overflow-wrap:anywhere;min-width:0}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.res{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--ink)}
.res:hover{border-color:var(--brand-text)}
.res .go{color:var(--brand-text);font-weight:700;margin-top:auto}
.lock{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);padding:18px 20px;border-radius:var(--radius)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius)}
.recap{display:flex;flex-direction:column;gap:12px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.photos button{padding:0;border:0;background:none;cursor:zoom-in}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:3px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative}
.thumb img{width:84px;height:64px;object-fit:cover;border-radius:3px;display:block}
.thumb button{position:absolute;top:2px;right:2px;font:inherit;font-size:.75rem;background:var(--ink);color:var(--paper);border:0;border-radius:3px;cursor:pointer;padding:0 6px}
.arch{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.arch>div{min-width:0}
@media (max-width:560px){.arch{grid-template-columns:1fr}}
.rank{font-family:var(--display);font-weight:800;font-size:1.4rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--radius);font-weight:600;z-index:60;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:.88rem;color:var(--muted)}

async function load(){
  const { data: { session: s } } = await sb.auth.getSession();
  authUser = s ? s.user : null;
  session = authUser ? authUser.email.toLowerCase() : null;
  const r = await sb.rpc('my_role');
  myRole = session ? (r.data || 'member') : 'guest';
  const signed = !!session, off = myRole === 'officer' || myRole === 'admin';
  const t = name => sb.from(name).select('*');
  const reqs = {
    settings: sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    profiles: t('officers_public'),
    events: t('events'),
    stats: sb.rpc('event_stats'),
    anns: t('announcements'),
    recaps: t('recaps'),
    archive: signed && t('archive'),
    members: signed && t('members'),
    rsvps: signed && t('rsvps'),
    att: signed && t('attendance'),
    dues: signed && t('dues'),
    leader: signed && sb.rpc('leaderboard'),
    appset: sb.from('app_settings').select('*').eq('id', 1).maybeSingle(),
    apps: signed && t('applications'),
    avail: signed && t('availability'),
    access: off && t('access_list'),
    codes: off && t('checkin_codes'),
    tasks: off && t('tasks'),
    log: myRole === 'admin' && sb.from('change_log').select('*').order('ts', { ascending:false }).limit(500)
  };
  const keys = Object.keys(reqs);
  const res = await Promise.all(keys.map(k => reqs[k] || Promise.resolve({ data:null })));
  const R = {};
  keys.forEach((k, i) => { if (res[i].error) console.warn(k, res[i].error.message); R[k] = res[i].data; });

  db.settings = { semester: R.settings?.semester || '', dues: Number(R.settings?.dues || 0) };
  db.profiles = {}; db.adminEmails = []; db.officerEmails = [];
  (R.profiles || []).forEach(p => {
    db.profiles[p.email] = { name:p.name, title:buildTitle(p.tier, p.branch), bio:p.bio, contact:p.contact, hours:p.hours, linkedin:p.linkedin, tier:p.tier || 'officer', branch:p.branch || '', photo:p.photo || '', majors:p.majors || [], minor:p.minor || '' };
    (p.role === 'admin' ? db.adminEmails : db.officerEmails).push(p.email);
  });
  if (R.access){
    db.adminEmails = R.access.filter(a => a.role === 'admin').map(a => a.email);
    db.officerEmails = R.access.filter(a => a.role === 'officer').map(a => a.email);
  }
  db.users = (R.members || []).map(m => {
    const majors = (m.majors && m.majors.length) ? m.majors : (m.major ? [m.major] : []);
    return { id:m.id, uvuid:m.uvuid, first:m.first, last:m.last, majors, minor:m.minor || '', major:majors.join(' & '), email:m.email, joined:m.joined };
  });
  const codes = {}; (R.codes || []).forEach(c => codes[c.event_id] = c.code);
  db.events = (R.events || []).map(e => ({ id:e.id, title:e.title, cat:e.cat, date:e.date, start:(e.start_time || '').slice(0,5), end:(e.end_time || '').slice(0,5), loc:e.loc, cap:e.cap || 0, desc:e.descr || '', code:codes[e.id] || null }));
  db.stats = {}; (R.stats || []).forEach(x => db.stats[x.event_id] = x);
  const group = rows => { const o = {}; (rows || []).forEach(x => (o[x.event_id] = o[x.event_id] || []).push(x.email)); return o; };
  db.rsvps = group(R.rsvps); db.attendance = group(R.att);
  db.announcements = (R.anns || []).map(a => ({ id:a.id, title:a.title, body:a.body, aud:a.aud, pinned:a.pinned, date:iso(new Date(a.created_at)), author:a.author }));
  db.recaps = (R.recaps || []).map(x => ({ id:x.id, eventId:x.event_id, title:x.title, body:x.body, photos:x.photos || [], date:iso(new Date(x.created_at)), author:x.author }));
  db.archive = (R.archive || []).map(a => ({ id:a.id, title:a.title, type:a.type, url:a.url || '', eventId:a.event_id, desc:a.descr || '', date:a.date }));
  db.tasks = (R.tasks || []).map(x => ({ id:x.id, title:x.title, eventId:x.event_id, who:x.owner, due:x.due, done:x.done }));
  db.dues = {}; (R.dues || []).forEach(d => db.dues[d.email] = { status:d.status, date:d.updated });
  db.leader = R.leader || [];
  db.app = { open: !!R.appset?.open, branches: R.appset?.branches || [], deadline: R.appset?.deadline || '', opened_at: R.appset?.opened_at || null };
  db.apps = (R.apps || []).map(a => ({ ...a, date: iso(new Date(a.created_at)) }));
  db.avail = {}; (R.avail || []).forEach(a => db.avail[a.email] = a.slots || []);
  db.log = (R.log || []).map(l => ({ ts:l.ts, who:l.who, text:l.text }));
}

const must = r => { if (r.error) throw r.error; return r.data; };
function errMsg(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/members_uvuid_unique|Database error saving new user/i.test(m)) return 'An account already uses this UVU ID.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Can’t reach the server. Check your connection and try again.';
  if (/row-level security|permission denied/i.test(m)) return 'You don’t have permission to do that.';
  return m;
}
// Run a change, reload everything, re-render. Errors show as a toast.
async function act(fn, ok){
  try { await fn(); await load(); if (ok) toast(ok); render(); return true; }
  catch(e){ toast(errMsg(e)); return false; }
}
async function logChange(text){ try { await sb.from('change_log').insert({ text }); } catch(e){} }

/* ---------- Roles ---------- */
const RANK = { guest:0, member:1, officer:2, admin:3 };
// Officers and admins can switch on "member view" to see the site the way members do.
function isStaff(){ return !!session && (myRole === 'officer' || myRole === 'admin'); }
function role(){ return session ? (isStaff() && ui.memberView ? 'member' : myRole) : 'guest'; }
function can(r){ return RANK[role()] >= RANK[r]; }
function roleOf(email){
  if (!email) return 'guest';
  const e = email.toLowerCase();
  if (e === session) return myRole;
  if (db.adminEmails.includes(e)) return 'admin';
  if (db.officerEmails.includes(e)) return 'officer';
  return 'member';
}
function me(){
  if (!session) return null;
  const meta = (authUser && authUser.user_metadata) || {};
  return db.users.find(u => u.email === session) || { uvuid:'', first: meta.first || session.split('@')[0], last: meta.last || '', major:'', email: session, joined: todayIso() };
}
function staffEmails(){ return [...db.adminEmails, ...db.officerEmails.filter(e => !db.adminEmails.includes(e))]; }
function userName(email){
  if (!email) return '';
  const u = db.users.find(x => x.email === email);
  if (u && (u.first || u.last)) return u.first + ' ' + u.last;
  return (db.profiles[email] && db.profiles[email].name) || email;
}

function isPast(ev){ return ev.date < todayIso(); }
function isToday(ev){ return ev.date === todayIso(); }
function catName(c){ return (CATS[c] || ['Event'])[0]; }
function ptsText(c){ return PTS[c] ? '+' + PTS[c] + ' points' : 'no points'; }
// Officer meetings are hidden from members, and from officers in member view.
function visibleEvents(){ return can('officer') ? db.events : db.events.filter(e => e.cat !== 'officer_meeting'); }
function sortedEvents(){ return [...visibleEvents()].sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start)); }
function upcoming(){ return sortedEvents().filter(e => !isPast(e)); }
function heldEvents(){ return sortedEvents().filter(e => e.date <= todayIso()).reverse(); }
function going(id){ return db.rsvps[id] || []; }
function attended(id){ return db.attendance[id] || []; }
function rsvpCount(id){ return db.stats[id] ? db.stats[id].rsvps : going(id).length; }
function attCount(id){ return db.stats[id] ? db.stats[id].attended : attended(id).length; }
function evById(id){ return db.events.find(e => e.id === id); }
function catVar(c){ return 'var(' + (CATS[c] || CATS.meeting)[1] + ')'; }
function points(email){ return db.events.reduce((s, e) => s + (attended(e.id).includes(email) ? PTS[e.cat] || 0 : 0), 0); }
function attendCount(email){ return db.events.filter(e => attended(e.id).includes(email)).length; }
function leaderboard(){
  return db.leader.map(x => ({ u:{ first:x.first, last:x.last, major:x.major, email:x.email }, pts:x.points, n:x.events }))
    .sort((a,b) => b.pts - a.pts || b.n - a.n || (a.u.last || '').localeCompare(b.u.last || ''));
}
function duesOf(email){ return (db.dues[email] || { status:'unpaid' }).status; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function datebox(s){ const d = parseDay(s); return `<div class="datebox"><span class="m">${MON[d.getMonth()]}</span><span class="d">${d.getDate()}</span></div>`; }
function initials(n){ return n.split(' ').map(s => s[0] || '').join('').slice(0,2).toUpperCase(); }
function randStr(n, A){ const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => A[x % A.length]).join(''); }
function newCode(){ return randStr(4, 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'); }
function tempPw(){ return randStr(4, 'ABCDEFGHJKMNPQRSTUVWXYZ') + '-' + randStr(5, 'abcdefghjkmnpqrstuvwxyz23456789'); }
function copyText(txt, label){
  const fallback = () => showModal(`<div class="modal-in"><div><button class="modal-x" data-act="close" aria-label="Close">×</button><h3>Copy ${esc(label)}</h3></div>
    <p class="muted">Your browser blocked automatic copying. The text is selected below. Press Ctrl+C (or ⌘C) to copy it.</p>
    <textarea id="copy-box" style="min-height:200px" readonly>${esc(txt)}</textarea></div>`, () => { const b = document.getElementById('copy-box'); b.focus(); b.select(); });
  try { navigator.clipboard.writeText(txt).then(() => toast(label[0].toUpperCase() + label.slice(1) + ' copied'), fallback); } catch(e){ fallback(); }
}

function renderChrome(route){
  const links = [['home','Home'],['calendar','Calendar'],['recaps','Recaps'],['officers','Officers'],['about','About'],['resources','Resources']];
  if (appsOpen()) links.push(['apply','Apply']);
  const mem = [['archive','Archive'],['leaderboard','Leaderboard'],['availability','Availability'],['account','My account']];
  const staff = [];
  if (can('officer')) staff.push(['officer','Officer tools']);
  if (can('admin')) staff.push(['admin','Admin']);
  const a = ([r,l], cls='') => `<a class="${cls}" href="#${r}" ${route===r?'aria-current="page"':''}>${l}</a>`;
  document.getElementById('nav').innerHTML = links.map(l => a(l)).join('') +
    (can('member') ? '<span class="sep"></span>' + mem.map(l => a(l)).join('') : '') +
    (staff.length ? '<span class="sep"></span>' + staff.map(([r,l]) => `<button class="menu-btn ${route===r?'current':''}" data-act="nav-menu" data-menu="${r}" aria-haspopup="true" aria-expanded="false">${l} ▾</button>`).join('') : '');
  const u = me(), r = role();
  document.getElementById('who').innerHTML = u
    ? `${isStaff() ? `<button class="btn on-dark ${ui.memberView ? '' : 'ghost'} small" data-act="member-view" aria-pressed="${!!ui.memberView}">${ui.memberView ? 'Member view: on' : 'Member view'}</button>` : ''}<span class="name">${esc(u.first)}</span><span class="role ${r}">${r}</span><button class="btn on-dark ghost small" data-act="signout">Sign out</button>`
    : `<a class="btn on-dark ghost small" href="#signin">Sign in</a><a class="btn on-dark small" href="#signup">Join</a>`;
  document.getElementById('foot-role').textContent = session ? 'Signed in as ' + r : '';

  const items = upcoming().slice(0, 6).map(e => {
    const d = parseDay(e.date);
    return `<span class="ticker-item"><span class="sym">WFA.${e.cat.slice(0,3).toUpperCase()}</span><span>${isToday(e) ? 'TODAY' : MON[d.getMonth()].toUpperCase() + ' ' + String(d.getDate()).padStart(2,'0')}</span><span>${esc(e.title.toUpperCase())}</span><span class="up">▲ ${rsvpCount(e.id)} RSVP</span></span>`;
  }).join('');
  document.getElementById('ticker').innerHTML = items ? items + items : '<span class="ticker-item">NO UPCOMING EVENTS POSTED</span>';
}

function annHtml(a){
  return `<article class="ann">
    <div class="ann-meta">${a.pinned?'<span class="tag pinned">Pinned</span>':''}${a.aud==='members'?'<span class="tag members">Members</span>':''}<span>${fmtDay(a.date)}</span><span>· ${esc(userName(a.author))}</span></div>
    <h3>${esc(a.title)}</h3><p class="ann-body">${esc(a.body)}</p></article>`;
}
function annList(limit){
  const all = [...db.announcements].sort((a,b) => (b.pinned - a.pinned) || b.date.localeCompare(a.date));
  const list = limit ? all.slice(0, limit) : all;
  return (list.length ? list.map(annHtml).join('') : '<div class="empty">No announcements yet.</div>') +
    (can('member') ? '' : `<div class="lock" style="margin-top:16px"><span>Members also see member-only announcements.</span><a class="btn small" href="#signin">Sign in</a></div>`);
}
function evRow(e){
  const n = rsvpCount(e.id), mine = session && going(e.id).includes(session), was = session && attended(e.id).includes(session);
  let status = '';
  if (was) status = '<div class="going">Attended</div>';
  else if (mine) status = isPast(e) ? '<div class="muted">RSVP’d, missed</div>' : '<div class="going">You’re going</div>';
  return `<button class="ev-row" data-act="open-event" data-id="${e.id}">
    ${datebox(e.date)}
    <div style="min-width:0"><div class="cat" style="--c:${catVar(e.cat)}">${catName(e.cat)}${isToday(e)?' · today':''}</div>
      <div class="ev-title">${esc(e.title)}</div>
      <div class="ev-sub">${fmtTime(e.start)}–${fmtTime(e.end)} · ${esc(e.loc)}</div></div>
    <div class="rsvp-count">${status}<span class="up">▲</span> ${n}${e.cap?` / ${e.cap}`:''}</div>
  </button>`;
}
function todayBar(){
  return visibleEvents().filter(isToday).map(e => {
    const done = session && attended(e.id).includes(session);
    return `<div class="today-bar"><div class="stack" style="gap:2px"><span class="live">Happening today · ${fmtTime(e.start)}</span><strong>${esc(e.title)}</strong></div>
      ${done ? '<span class="going">You’re checked in ✓</span>' : `<button class="btn small" data-act="open-event" data-id="${e.id}">${can('officer') ? 'Open check-in' : 'Check in'}</button>`}</div>`;
  }).join('');
}
function gate(need){
  if (!session) return `<div class="view"><div class="lock"><span>This page is for members. Sign in or join to see it.</span><div class="row"><a class="btn small ghost" href="#signup">Join</a><a class="btn small" href="#signin">Sign in</a></div></div></div>`;
  return `<div class="view"><div class="lock"><span>This page is for ${need}s. Your account is on the ${role()} list.</span><a class="btn small" href="#home">Go home</a></div></div>`;
}
function delBtn(key, label, act, id){
  const armed = ui.armed === key;
  return `<button class="btn danger small ${armed?'armed':''}" data-act="${act}" data-id="${esc(id)}" data-key="${esc(key)}">${armed ? 'Click again to confirm' : label}</button>`;

function viewCalendar(){
  const m = ui.cal, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1 - m.getDay());
  const end = new Date(y, mo + 1, 0);
  const weeks = Math.ceil((m.getDay() + end.getDate()) / 7);
  const byDay = {};
  visibleEvents().filter(e => ui.catsOn.has(e.cat)).forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  Object.values(byDay).forEach(l => l.sort((a,b) => a.start.localeCompare(b.start)));
  let cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), evs = byDay[k] || [];
    cells += `<div class="cell ${d.getMonth()!==mo?'out':''} ${k===todayIso()?'today':''}">
      <span class="num">${d.getDate()}</span>
      ${evs.map(e => `<button class="cal-ev" style="--c:${catVar(e.cat)}" data-act="open-event" data-id="${e.id}" title="${esc(e.title)}"><span class="t">${fmtTime(e.start).replace(':00','')}</span>${esc(e.title)}</button>`).join('')}
    </div>`;
  }
  const monthEvents = sortedEvents().filter(e => ui.catsOn.has(e.cat) && parseDay(e.date).getMonth() === mo && parseDay(e.date).getFullYear() === y);
  return `<div class="view">
    <div class="cal-bar">
      <div class="row"><h2>${MONTHS[mo]} ${y}</h2>
        <div class="row" style="gap:6px"><button class="btn ghost small" data-act="cal" data-d="-1" aria-label="Previous month">←</button><button class="btn ghost small" data-act="cal" data-d="0">Today</button><button class="btn ghost small" data-act="cal" data-d="1" aria-label="Next month">→</button></div>
      </div>
      ${can('officer')?'<a class="btn small" href="#officer" data-tab="events">+ Add event</a>':''}
    </div>
    <div class="filters" aria-label="Filter by type">${Object.entries(CATS).filter(([k]) => k !== 'officer_meeting' || can('officer')).map(([k,[l,v]]) => `<button class="chip" style="--c:var(${v})" aria-pressed="${ui.catsOn.has(k)}" data-act="cat" data-cat="${k}">${l}</button>`).join('')}</div>
    <div class="cal-scroll"><div class="cal">${cells}</div></div>
    <section class="stack">
      <div class="section-head"><h2>This month</h2><span class="muted">${monthEvents.length} event${monthEvents.length===1?'':'s'}</span></div>
      <div class="ev-list">${monthEvents.map(evRow).join('') || '<div class="empty">Nothing scheduled this month.</div>'}</div>
    </section>
  </div>`;
}

function officerSections(staff){
  staff = staff.filter(e => (db.profiles[e] || {}).tier !== 'honorary');
  if (!staff.length) return '<div class="empty">No officers listed yet.</div>';
  const P = e => db.profiles[e] || {};
  const pres = staff.filter(e => P(e).tier === 'president');
  const advisors = staff.filter(e => P(e).tier === 'advisor');
  const vps = staff.filter(e => P(e).tier === 'vice_president');
  const rest = staff.filter(e => !['president', 'vice_president', 'advisor'].includes(P(e).tier));
  const groups = [['Presidents', pres], [vps.length > 1 ? 'Vice Presidents' : 'Vice President', vps], [advisors.length > 1 ? 'Faculty advisors' : 'Faculty advisor', advisors], ...Object.entries(BRANCHES).map(([k,l]) => [l, rest.filter(e => P(e).branch === k)]), ['Officers', rest.filter(e => !BRANCHES[P(e).branch])]];
  return groups.filter(([,l]) => l.length).map(([label, l]) => `<section class="stack"><div class="section-head"><h2>${esc(label)}</h2><span class="muted">${l.length}</span></div><div class="officers">${l.map(officerCard).join('')}</div></section>`).join('');
}

function pickChips(p, majors){
  return majors.map((m,i) => `<span class="pick">${esc(m)}<button type="button" data-act="rm-major" data-p="${p}" data-i="${i}" aria-label="Remove ${esc(m)}">×</button></span>`).join('') || '<span class="hint">No majors added yet.</span>';

// Adds whatever is typed in the major box. Returns false if it isn't a catalog major.
function addMajor(p){
  const inp = document.getElementById(p + '-major-in'); if (!inp) return true;
  const val = inp.value.trim(); if (!val) return true;
  const match = MAJORS.find(m => m.toLowerCase() === val.toLowerCase());
  if (!match){ toast('Choose a major from the list that appears as you type.'); return false; }
  const l = ui.picks[p] = ui.picks[p] || [];
  if (!l.includes(match)) l.push(match);
  inp.value = ''; document.getElementById(p + '-picks').innerHTML = pickChips(p, l); inp.focus();
  return true;
}
function readPicker(p){
  if (!addMajor(p)) return { error: 'Choose a major from the list that appears as you type, then click Add.' };
  const el = document.getElementById(p + '-minor'), minor = el ? el.value.trim() : '';
  const match = minor && MINORS.find(m => m.toLowerCase() === minor.toLowerCase());
  if (minor && !match) return { error: 'Choose a minor from the list, or leave it blank.' };
  return { majors: [...(ui.picks[p] || [])], minor: match || '' };
}

// Attendance for an applicant: events attended out of all events held, and how often they show up when they RSVP.
function applicantStats(email){
  const held = heldEvents().filter(e => e.cat !== 'officer_meeting');
  const came = held.filter(e => attended(e.id).includes(email)).length;
  const rsvpd = held.filter(e => going(e.id).includes(email));
  const showed = rsvpd.filter(e => attended(e.id).includes(email)).length;
  return { came, held: held.length, pctEvents: held.length ? Math.round(came / held.length * 100) : null,
    rsvps: rsvpd.length, pctRsvp: rsvpd.length ? Math.round(showed / rsvpd.length * 100) : null };
}

async function bulkAdd(){
  const rows = ui.bulk.map(r => ({ ...r, email: r.email.trim().toLowerCase(), first: r.first.trim(), last: r.last.trim(), title: buildTitle(r.tier, r.branch) }))
    .filter(r => r.email || r.first || r.last);
  if (!rows.length) return toast('Fill in at least one row.');
  const bad = rows.find(r => !EMAIL_RE.test(r.email) || !r.first || !r.last);
  if (bad) return toast('Each row needs a valid email and a first and last name. Check the row for ' + (bad.email || bad.first || 'the blank email') + '.');
  const seen = new Set(), dup = rows.find(r => seen.has(r.email) || !seen.add(r.email));
  if (dup) return toast(dup.email + ' is listed twice.');
  ui.bulkBusy = true; ui.bulkResults = []; render();
  for (const r of rows){
    const prev = db.profiles[r.email] || {};
    try {
      if (ui.bulkSend){
        const { data, error } = await sb.functions.invoke('invite-officer', { body: { email: r.email, first: r.first, last: r.last, role: r.level, title: r.title, tier: r.tier, branch: r.branch,
          contact: prev.contact || '', hours: prev.hours || '', linkedin: prev.linkedin || '', bio: prev.bio || '', password: tempPw(), send: true } });
        if (error){ let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch(_){} throw new Error(m); }
        if (!['president', 'officer'].includes(r.tier)) await sb.from('officer_profiles').update({ tier: r.tier }).eq('email', r.email);
        ui.bulkResults.push({ email: r.email, ok: !data.warning, msg: data.emailed ? 'Added and emailed login details' : (data.warning || 'Added') });
      } else {
        must(await sb.from('access_list').upsert({ email: r.email, role: r.level }));
        must(await sb.from('officer_profiles').upsert({ email: r.email, name: r.first + ' ' + r.last, title: r.title, tier: r.tier, branch: r.branch }));
        await logChange('Gave ' + r.email + ' ' + r.level + ' access');
        ui.bulkResults.push({ email: r.email, ok: true, msg: 'Added to the officer list' });
      }
    } catch(e){ ui.bulkResults.push({ email: r.email, ok: false, msg: errMsg(e) }); }
    render();
  }
  ui.bulkBusy = false;
  const failed = ui.bulkResults.filter(x => !x.ok).map(x => x.email);
  ui.bulk = ui.bulk.filter(r => failed.includes(r.email.trim().toLowerCase()));
  if (!ui.bulk.length) ui.bulk = [bulkRow(), bulkRow(), bulkRow()];
  await load(); render();
  toast(failed.length ? `${rows.length - failed.length} added, ${failed.length} need attention` : `Added ${rows.length} officer${rows.length === 1 ? '' : 's'}`);
}

/* ---------- Weekly availability ---------- */
const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
const BLOCKS = [8, 10, 12, 14, 16, 18, 20];   // two-hour blocks starting at these hours
const OFFICER_WEIGHT = 3;                     // an officer's availability counts this many times a member's
function blockLabel(h){ const f = x => (x % 12 || 12) + (x < 12 ? ' AM' : ' PM'); return f(h) + '–' + f(h + 2); }
function slotLabel(key){ const [k, h] = key.split('-'); return DAYS.find(d => d[0] === k)[1] + ' ' + blockLabel(+h); }
function availDraft(){ if (!ui.availDraft) ui.availDraft = new Set(db.avail[session] || []); return ui.availDraft; }
function viewAvailability(){
  if (!can('member')) return gate('member');
  const d = availDraft(), saved = db.avail[session];
  return `<div class="view">
    <section class="page-head"><div class="eyebrow">Members</div><h1 class="page">When are you free?</h1>
      <p class="muted">Tap the times you’re usually free each week, then save. Officers use this to schedule events when the most people can come.</p></section>
    <div class="table-wrap"><table class="avail"><thead><tr><th></th>${DAYS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>
      ${BLOCKS.map(h => `<tr><th scope="row">${blockLabel(h)}</th>${DAYS.map(([k, l]) => { const key = k + '-' + h, on = d.has(key);
        return `<td><button class="slot ${on ? 'on' : ''}" data-act="avail-cell" data-id="${key}" aria-pressed="${on}" aria-label="${l} ${blockLabel(h)}">${on ? '✓' : ''}</button></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn" data-act="avail-save">Save availability</button><button class="btn ghost" data-act="avail-clear">Clear all</button>
      <span class="hint">${saved ? saved.length + ' time block' + (saved.length === 1 ? '' : 's') + ' saved.' : 'Not saved yet.'}</span></div>
    ${can('officer') ? '<p class="hint">See everyone’s availability under Officer tools → Availability.</p>' : ''}
  </div>`;
}
function availabilityChart(){
  const staff = new Set(staffEmails());
  const rows = Object.entries(db.avail).filter(([, sl]) => sl.length);
  if (!rows.length) return '<div class="empty">No one has shared their availability yet. Members fill it out on the Availability page.</div>';
  const offs = rows.filter(([e]) => staff.has(e)), mems = rows.filter(([e]) => !staff.has(e));
  const max = offs.length * OFFICER_WEIGHT + mems.length;
  const cell = key => { const o = offs.filter(([, sl]) => sl.includes(key)).length, m = mems.filter(([, sl]) => sl.includes(key)).length; return { key, o, m, score: o * OFFICER_WEIGHT + m }; };
  const top = BLOCKS.flatMap(h => DAYS.map(([k]) => cell(k + '-' + h))).filter(c => c.score).sort((a, b) => b.score - a.score || b.o - a.o).slice(0, 5);
  return `<div class="stack" style="gap:24px">
    <p class="muted">${offs.length} officer${offs.length === 1 ? '' : 's'} and ${mems.length} member${mems.length === 1 ? '' : 's'} have shared their availability. Officers count ${OFFICER_WEIGHT}× as much as members when ranking times.</p>
    <section class="stack"><div class="section-head"><h3>Best times</h3></div>
      <ol class="best">${top.map(c => `<li><strong>${slotLabel(c.key)}</strong><span class="muted">${c.o} of ${offs.length} officers · ${c.m} of ${mems.length} members</span></li>`).join('')}</ol></section>
    <div class="table-wrap"><table class="avail"><thead><tr><th></th>${DAYS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>
      ${BLOCKS.map(h => `<tr><th scope="row">${blockLabel(h)}</th>${DAYS.map(([k, l]) => { const c = cell(k + '-' + h), a = max ? c.score / max : 0;
        return `<td><div class="heat" style="--a:${a.toFixed(2)};${a > .55 ? 'color:#fff;' : ''}" title="${l} ${blockLabel(h)}: ${c.o} officers, ${c.m} members">${c.o}/${c.m}</div></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="hint">Each square shows officers / members free at that time. Darker green means more people, with officers counting most.</p>
  </div>`;
}

/* ---------- Admin ---------- */
function exportRows(){
  const head = ['UVU ID','First name','Last name','Majors','Minor','Email','Role','Joined', ...(DUES_ENABLED ? ['Dues'] : []),'Events attended','Points'];
  return [head, ...db.users.map(u => [u.uvuid, u.first, u.last, u.major, u.minor, u.email, roleOf(u.email), u.joined, ...(DUES_ENABLED ? [duesOf(u.email)] : []), attendCount(u.email), points(u.email)])];
}
function exportTsv(){
  const clean = v => String(v ?? '').replace(/[\t\n\r]/g, ' ');
  return exportRows().map(r => r.map(clean).join('\t')).join('\n');
}
function downloadCsv(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = exportRows().map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'wfa-members-' + todayIso() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

// Center-crops an image to a square of at most `size` pixels.
function shrinkSquare(file, size){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = Math.min(size, s);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej; img.src = url;
  });
}
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}

async function handleSubmit(f, v, err){
  if (f.id === 'f-signin'){
    const email = v('si-email').toLowerCase(), pw = document.getElementById('si-pw').value;
    if (!email || !pw) return err('si-err', 'Enter your email and password.');
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) return err('si-err', /not confirmed/i.test(error.message) ? 'Confirm your email first. Click the link we sent when you signed up.' : /invalid login/i.test(error.message) ? 'Email or password is incorrect.' : errMsg(error));
    ui.notice = ''; await afterLogin(); toast('Signed in as ' + myRole);
  }

  if (f.id === 'f-signup'){
    const d = { uvuid: v('su-id'), first: v('su-first'), last: v('su-last'), email: v('su-email').toLowerCase() };
    const pick = readPicker('su'); if (pick.error) return err('su-err', pick.error);
    const pw = document.getElementById('su-pw').value, pw2 = document.getElementById('su-pw2').value;
    if (!/^\d{8}$/.test(d.uvuid)) return err('su-err', 'UVU ID must be 8 digits.');
    if (!d.first || !d.last) return err('su-err', 'Enter your first and last name.');
    if (!pick.majors.length) return err('su-err', 'Add at least one major. Use “Undeclared” if you haven’t picked one.');
    if (!EMAIL_RE.test(d.email)) return err('su-err', 'Enter a valid email address.');
    if (pw.length < 8) return err('su-err', 'Password needs at least 8 characters.');
    if (pw !== pw2) return err('su-err', 'Passwords don’t match.');
    const { data, error } = await sb.auth.signUp({ email: d.email, password: pw,
      options: { data: { uvuid: d.uvuid, first: d.first, last: d.last, majors: pick.majors, minor: pick.minor, major: pick.majors[0] }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return err('su-err', errMsg(error));
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return err('su-err', 'An account already uses this email. Sign in instead.');
    if (data.session){ await afterLogin(); toast('Welcome to the WFA, ' + d.first); }
    else { ui.prefillEmail = d.email; location.hash = 'signin'; ui.notice = `Almost done. We sent a confirmation link to ${d.email}. Click it, then sign in.`; render(); }
  }

  if (f.id === 'f-reset1'){
    const email = v('rs-email').toLowerCase();
    if (!EMAIL_RE.test(email)) return err('rs-err', 'Enter the email you signed up with.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return err('rs-err', errMsg(error));
    ui.reset = { step:2, email }; render();
  }

  if (f.id === 'f-reset2'){
    const email = ui.reset.email, code = v('rs-code');
    const pw = document.getElementById('rs-pw').value, pw2 = document.getElementById('rs-pw2').value;
    if (!/^\d{6,10}$/.test(code)) return err('rs-err', 'Enter the code from the email.');
    if (pw.length < 8) return err('rs-err', 'Password needs at least 8 characters.');
    if (pw !== pw2) return err('rs-err', 'Passwords don’t match.');
    const vr = await sb.auth.verifyOtp({ email, token: code, type: 'recovery' });
    if (vr.error) return err('rs-err', 'That code isn’t valid or has expired. Send a new code.');
    const ur = await sb.auth.updateUser({ password: pw, data: { must_change: false } });
    if (ur.error) return err('rs-err', errMsg(ur.error));
    ui.reset = { step:1, email:'' }; ui.recovery = false;
    await load(); toast('Password updated. You’re signed in.'); location.hash = 'home'; render();
  }

  if (f.id === 'f-majors'){
    const pick = readPicker('ac'); if (pick.error) return err('ac-err', pick.error);
    if (!pick.majors.length) return err('ac-err', 'Add at least one major.');
    const r = await sb.from('members').update({ majors: pick.majors, minor: pick.minor, major: pick.majors[0] }).eq('id', authUser.id);
    if (r.error) return err('ac-err', errMsg(r.error));
    ui.editMajors = false; await load(); toast('Profile saved'); render();
  }

  if (f.id === 'f-setup'){
    const pwEl = document.getElementById('st-pw'), idEl = document.getElementById('st-id');
    const upd = {};
    if (idEl){ const id = idEl.value.trim(); if (!/^\d{8}$/.test(id)) return err('st-err', 'UVU ID must be 8 digits.'); upd.uvuid = id; }
    if (document.getElementById('st-major-in')){
      const pick = readPicker('st'); if (pick.error) return err('st-err', pick.error);
      if (!pick.majors.length) return err('st-err', 'Add at least one major. Use “Undeclared” if you haven’t picked one.');
      Object.assign(upd, { majors: pick.majors, minor: pick.minor, major: pick.majors[0] });
    }
    if (pwEl){
      const pw = pwEl.value, pw2 = document.getElementById('st-pw2').value;
      if (pw.length < 8) return err('st-err', 'Password needs at least 8 characters.');
      if (pw !== pw2) return err('st-err', 'Passwords don’t match.');
    }
    if (Object.keys(upd).length){ const r = await sb.from('members').update(upd).eq('id', authUser.id); if (r.error) return err('st-err', errMsg(r.error)); }
    if (pwEl){
      const ur = await sb.auth.updateUser({ password: pwEl.value, data: { must_change: false } });
      if (ur.error) return err('st-err', errMsg(ur.error));
    }
    ui.recovery = false; await load(); toast('You’re all set');
    location.hash = myRole === 'admin' ? 'admin' : myRole === 'officer' ? 'officer' : 'home'; render();
  }

  if (f.id === 'f-checkin'){
    const id = f.dataset.id, e = evById(id), code = v('ci-code').toUpperCase();
    const r = await sb.rpc('check_in', { p_event: id, p_code: code });
    if (r.error) return err('ci-err', errMsg(r.error));
    const msg = { closed:'Check-in is only open on the day of the event.', notstarted:'Check-in hasn’t started yet. Wait for an officer to show the code.',
      wrong:'That code doesn’t match. Check the screen and try again.', signin:'Sign in first.', missing:'This event no longer exists.' }[r.data];
    if (msg) return err('ci-err', msg);
    await load(); toast('Checked in · ' + ptsText(e.cat)); render(); openEvent(id);
  }

  if (f.id === 'f-mark'){
    const id = f.dataset.id, who = v('mark-who'); if (!who) return;
    await act(async () => { must(await sb.from('attendance').insert({ event_id: id, email: who })); await logChange('Marked ' + userName(who) + ' present at “' + evById(id).title + '”'); }, userName(who) + ' marked present');
  }

  if (f.id === 'f-event'){
    const e = { title: v('ev-title'), cat: v('ev-cat'), date: v('ev-date'), start_time: v('ev-start'), end_time: v('ev-end'), loc: v('ev-loc'), cap: Math.max(0, parseInt(v('ev-cap')) || 0), descr: v('ev-desc') };
    if (!e.title || !e.date || !e.start_time || !e.end_time || !e.loc) return err('ev-err', 'Fill in the title, date, times, and location.');
    if (e.end_time <= e.start_time) return err('ev-err', 'End time must be after the start time.');
    const editing = ui.editEvent;
    const ok = await act(async () => {
      if (editing){ must(await sb.from('events').update(e).eq('id', editing)); await logChange('Edited event “' + e.title + '”'); }
      else { must(await sb.from('events').insert(e)); await logChange('Added event “' + e.title + '” on ' + fmtDay(e.date)); }
      ui.editEvent = null;
    }, editing ? 'Event updated' : 'Added to the calendar');
  }

  if (f.id === 'f-ann'){
    const a = { title: v('an-title'), body: v('an-body'), aud: v('an-aud'), pinned: document.getElementById('an-pin').checked };
    if (!a.title || !a.body) return err('an-err', 'Add a headline and a message.');
    await act(async () => { must(await sb.from('announcements').insert(a)); await logChange('Posted announcement “' + a.title + '”'); }, 'Announcement posted');
  }

  if (f.id === 'f-recap'){
    const r = { event_id: v('rc-ev') || null, title: v('rc-title'), body: v('rc-body') };
    if (!r.title || !r.body) return err('rc-err', 'Add a headline and the recap text.');
    document.getElementById('rc-submit').textContent = 'Uploading…';
    const urls = [];
    for (const p of ui.recapPhotos){
      const blob = await (await fetch(p)).blob();
      const path = crypto.randomUUID() + '.jpg';
      const up = await sb.storage.from('recap-photos').upload(path, blob, { contentType: 'image/jpeg' });
      if (up.error){ document.getElementById('rc-submit').textContent = 'Publish recap'; return err('rc-err', 'A photo didn’t upload: ' + errMsg(up.error)); }
      urls.push(sb.storage.from('recap-photos').getPublicUrl(path).data.publicUrl);
    }
    r.photos = urls;
    const ok = await act(async () => { must(await sb.from('recaps').insert(r)); await logChange('Published recap “' + r.title + '”'); }, 'Recap published');
    if (ok) ui.recapPhotos = [];
  }

  if (f.id === 'f-arch'){
    const a = { title: v('ar-title'), type: v('ar-type'), event_id: v('ar-ev') || null, url: v('ar-url'), descr: v('ar-desc') };
    if (!a.title) return err('ar-err', 'Add a title.');
    if (a.url && !/^https?:\/\//i.test(a.url)) return err('ar-err', 'Links must start with https://');
    const e = evById(a.event_id); a.date = e ? e.date : todayIso();
    await act(async () => { must(await sb.from('archive').insert(a)); await logChange('Added “' + a.title + '” to the archive'); }, 'Added to the archive');
  }

  if (f.id === 'f-task'){
    const t = { title: v('tk-title'), event_id: v('tk-ev') || null, due: v('tk-due') || todayIso(), owner: v('tk-who'), done: false };
    if (!t.title) return err('tk-err', 'Describe the task.');
    await act(async () => { must(await sb.from('tasks').insert(t)); await logChange('Added task “' + t.title + '” for ' + userName(t.owner)); }, 'Task added');
  }

  if (f.dataset.appNote){
    const aid = f.dataset.appNote, notes = f.querySelector('textarea').value;
    await act(async () => must(await sb.from('applications').update({ notes }).eq('id', aid)), 'Notes saved');
  }

  if (f.id === 'f-appset'){
    const open = document.getElementById('as-open').checked;
    const branches = [...f.querySelectorAll('[data-branch]')].filter(c => c.checked).map(c => c.dataset.branch);
    const deadline = v('as-deadline') || null;
    if (open && !branches.length) return err('as-err', 'Pick at least one branch before opening applications.');
    if (open && deadline && deadline < todayIso()) return err('as-err', 'That deadline has passed. Pick a later date or clear it.');
    const opening = open && !db.app.open;
    const notifyEl = document.getElementById('as-notify'), notify = opening && notifyEl && notifyEl.checked;
    const upd = { open, branches, deadline };
    if (opening) upd.opened_at = new Date().toISOString();
    must(await sb.from('app_settings').update(upd).eq('id', 1));
    await logChange(opening ? 'Opened officer applications' : (!open && db.app.open) ? 'Closed officer applications' : 'Updated officer application settings');
    await load(); render(); toast(opening ? 'Applications are open' : 'Settings saved');
    if (notify) await notifyApplicationsOpen();
  }

  if (f.id === 'f-apply'){
    if (!appsOpen()) return err('ap-err', 'Applications just closed.');
    let branches;
    if (db.app.branches.length === 1) branches = [...db.app.branches];
    else {
      const picks = [...f.querySelectorAll('[data-rank]')].map(sel => ({ b: sel.dataset.rank, r: +sel.value })).filter(x => x.r > 0).sort((a, b) => a.r - b.r);
      if (!picks.length) return err('ap-err', 'Rank at least one branch.');
      if (picks.some((x, i) => x.r !== i + 1)) return err('ap-err', 'Use each choice once, starting with 1st choice.');
      branches = picks.map(x => x.b);
    }
    const year = v('ap-year'), grad = v('ap-grad-term') + ' ' + v('ap-grad-year'), why = v('ap-why'), ideas = v('ap-ideas'), linkedin = v('ap-linkedin'), other = v('ap-other');
    const file = document.getElementById('ap-resume').files[0];
    if (!year) return err('ap-err', 'Choose your year in school.');
    if (!why || !ideas) return err('ap-err', 'Answer both questions about the role.');
    if (!file) return err('ap-err', 'Attach your resume as a PDF.');
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') return err('ap-err', 'Your resume needs to be a PDF.');
    if (file.size > 5 * 1024 * 1024) return err('ap-err', 'That PDF is over 5 MB. Try saving a smaller copy.');
    if (linkedin && !/^https?:\/\//i.test(linkedin)) return err('ap-err', 'The LinkedIn link must start with https://');
    const path = authUser.id + '/' + crypto.randomUUID() + '.pdf';
    const up = await sb.storage.from('resumes').upload(path, file, { contentType: 'application/pdf' });
    if (up.error) return err('ap-err', 'Your resume didn’t upload: ' + errMsg(up.error));
    const ins = await sb.from('applications').insert({ cycle: db.app.opened_at, branches, year, grad, why, ideas, linkedin, other, resume_path: path });
    if (ins.error){ await sb.storage.from('resumes').remove([path]); return err('ap-err', errMsg(ins.error)); }
    await load(); toast('Application submitted'); render(); window.scrollTo(0,0);
  }

  if (f.id === 'f-semester'){
    const sem = v('sem-name'); if (!sem) return;
    await act(async () => { must(await sb.from('settings').update({ semester: sem }).eq('id', 1)); await logChange('Set the semester to ' + sem); }, 'Semester saved');
  }

  if (f.id === 'f-dues-set'){
    const sem = v('ds-sem'), amt = Math.max(0, parseFloat(v('ds-amt')) || 0);
    if (!sem) return;
    await act(async () => { must(await sb.from('settings').update({ semester: sem, dues: amt }).eq('id', 1)); await logChange('Set dues to $' + amt + ' for ' + sem); }, 'Dues settings saved');
  }

  if (f.id === 'f-profile'){
    const contact = v('pf-contact'), linkedin = v('pf-linkedin');
    if (contact && !EMAIL_RE.test(contact)) return err('pf-err', 'Enter a valid contact email.');
    if (linkedin && !/^https?:\/\//i.test(linkedin)) return err('pf-err', 'LinkedIn link must start with https://');
    const p = db.profiles[session] || {};
    await act(async () => {
      let photo = p.photo || '';
      if (ui.profilePhoto !== null){
        const old = photo.split('/officer-photos/')[1];
        photo = '';
        if (ui.profilePhoto){
          const path = crypto.randomUUID() + '.jpg';
          must(await sb.storage.from('officer-photos').upload(path, await (await fetch(ui.profilePhoto)).blob(), { contentType: 'image/jpeg' }));
          photo = sb.storage.from('officer-photos').getPublicUrl(path).data.publicUrl;
        }
        if (old) await sb.storage.from('officer-photos').remove([old]);
      }
      must(await sb.from('officer_profiles').upsert({ email: session, photo, title: p.title || '', tier: p.tier || 'officer', branch: p.branch || '', name: v('pf-name'), contact, hours: v('pf-hours'), linkedin, bio: v('pf-bio') }));
      ui.profilePhoto = null;
      await logChange('Updated their officer profile');
    }, 'Profile saved');
  }

  if (f.id === 'f-officer'){
    const email = v('of-email').toLowerCase(), level = v('of-level'), contact = v('of-contact'), linkedin = v('of-linkedin');
    const first = v('of-first'), last = v('of-last'), pw = v('of-pw'), send = document.getElementById('of-send').checked;
    const hours = v('of-hours'), bio = v('of-bio'), tier = v('of-tier'), branch = v('of-branch'), title = buildTitle(tier, branch);
    if (!EMAIL_RE.test(email)) return err('of-err', 'Enter a valid login email.');
    if (!first || !last) return err('of-err', 'Enter their first and last name.');
    if (pw && pw.length < 8) return err('of-err', 'Temporary password needs at least 8 characters.');
    if (contact && !EMAIL_RE.test(contact)) return err('of-err', 'Enter a valid contact email.');
    if (linkedin && !/^https?:\/\//i.test(linkedin)) return err('of-err', 'LinkedIn link must start with https://');

    if (level === 'member'){
      must(await sb.from('access_list').delete().eq('email', email));
      await sb.from('officer_profiles').delete().eq('email', email);
      await logChange('Changed ' + email + ' back to a member');
      ui.editOfficer = null; await load(); render(); toast(userName(email) + ' is now a member');
      return;
    }
    if (pw){
      // Creating accounts and sending email needs the server function.
      const { data, error } = await sb.functions.invoke('invite-officer', { body: { email, first, last, role: level, title, tier, branch, contact, hours, linkedin, bio, password: pw, send } });
      if (error){
        let m = error.message;
        try { const j = await error.context.json(); m = j.error || m; } catch(_){}
        if (/Failed to send a request|not found|404/i.test(m)) m = 'The invite-officer function isn’t set up yet. Leave the password blank for now, or finish step 4 of the setup guide.';
        return err('of-err', m);
      }
      if (!['president', 'officer'].includes(tier)) await sb.from('officer_profiles').update({ tier }).eq('email', email);
      ui.editOfficer = null; await load(); render();
      toast(data.emailed ? 'Saved. Login details emailed to ' + email : (data.warning || 'Saved ' + email + ' as ' + level));
      return;
    }
    const before = roleOf(email);
    must(await sb.from('access_list').upsert({ email, role: level }));
    must(await sb.from('officer_profiles').upsert({ email, name: first + ' ' + last, title, tier, branch, contact, hours, linkedin, bio }));
    if (db.users.some(u => u.email === email)) await sb.from('members').update({ first, last }).eq('email', email);
    await logChange(before === level ? 'Edited officer profile for ' + email : 'Gave ' + email + ' ' + level + ' access');
    ui.editOfficer = null; await load(); render(); toast('Saved ' + email + ' as ' + level);
  }
}

/* ---------- Start ---------- */
sb.auth.onAuthStateChange(event => { if (event === 'PASSWORD_RECOVERY'){ ui.recovery = true; if (loaded) render(); } });
(async () => {
  document.getElementById('dl-majors').innerHTML = MAJORS.map(m => `<option value="${esc(m)}">`).join('');
  document.getElementById('dl-minors').innerHTML = MINORS.map(m => `<option value="${esc(m)}">`).join('');
  if (/type=recovery/.test(initialHash)) ui.recovery = true;
  const m = initialHash.match(/error_description=([^&]+)/);
  try { await load(); }
  catch(e){ document.getElementById('app').innerHTML = `<div class="empty">Couldn’t load club data. ${esc(errMsg(e))}</div>`; return; }
  if (/access_token|error_description/.test(initialHash)) history.replaceState(null, '', location.pathname + '#home');
  loaded = true; render();
  if (m) toast(decodeURIComponent(m[1].replace(/\+/g, ' ')));
})();
</script>
</body>
</html>
